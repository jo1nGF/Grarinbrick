name: Android

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Extrair GrainBrick-Android.zip
        run: |
          ZIP_PATH="$GITHUB_WORKSPACE/GrainBrick-Android.zip"
          EXTRACT_DIR="$RUNNER_TEMP/grainbrick-zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "Não foi encontrado: $ZIP_PATH"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -o "$ZIP_PATH" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/tests/host/build.sh" ]; then
            PROJECT_ROOT="$EXTRACT_DIR"
          else
            BUILD_SCRIPT=$(find "$EXTRACT_DIR" -type f -path '*/tests/host/build.sh' -print -quit)
            if [ -z "$BUILD_SCRIPT" ]; then
              echo "Não foi encontrado tests/host/build.sh dentro do ZIP."
              echo "Arquivos extraídos:"
              find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -200
              exit 1
            fi
            PROJECT_ROOT="${BUILD_SCRIPT%/tests/host/build.sh}"
          fi

          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      - name: Build and run the engine tests (synthetic signals, fuzzing, threading, no-allocation check)
        run: |
          tests/host/build.sh build engine_test dump_params
          ./build/engine_test

      - name: Validate bundled presets against the parameter registry
        run: |
          ./build/dump_params > build/params.tsv
          python3 tools/validate_presets.py build/params.tsv

  apk:
    needs: engine-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Extrair GrainBrick-Android.zip
        run: |
          ZIP_PATH="$GITHUB_WORKSPACE/GrainBrick-Android.zip"
          EXTRACT_DIR="$RUNNER_TEMP/grainbrick-zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "Não foi encontrado: $ZIP_PATH"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -o "$ZIP_PATH" -d "$EXTRACT_DIR"

          if [ -f "$EXTRACT_DIR/tests/host/build.sh" ]; then
            PROJECT_ROOT="$EXTRACT_DIR"
          else
            BUILD_SCRIPT=$(find "$EXTRACT_DIR" -type f -path '*/tests/host/build.sh' -print -quit)
            if [ -z "$BUILD_SCRIPT" ]; then
              echo "Não foi encontrado tests/host/build.sh dentro do ZIP."
              echo "Arquivos extraídos:"
              find "$EXTRACT_DIR" -maxdepth 5 -type f | sort | head -200
              exit 1
            fi
            PROJECT_ROOT="${BUILD_SCRIPT%/tests/host/build.sh}"
          fi

          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore the release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.GB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GB_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore restored: the release APK will be signed with it."
          else
            echo "No GB_KEYSTORE_BASE64 secret: the release APK will be signed with the debug key."
          fi

      - name: Build debug and release APKs
        env:
          GB_KEYSTORE_PASSWORD: ${{ secrets.GB_KEYSTORE_PASSWORD }}
          GB_KEY_ALIAS: ${{ secrets.GB_KEY_ALIAS }}
          GB_KEY_PASSWORD: ${{ secrets.GB_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GrainBrick-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/GrainBrick-${VERSION}-release.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: GrainBrick-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs
          path: |
            app/.cxx/**/*.txt
            app/.cxx/**/*.log
            app/build/reports/**
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GrainBrick-APKs
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
